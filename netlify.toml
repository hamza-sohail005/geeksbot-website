# Netlify config for the GeeksBot Next.js (App Router) site.
# The Next.js runtime plugin handles SSR/ISR, routing and Image Optimization.

[build]
  command = "npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Hashed build assets (JS, CSS, next/font files) never change for a given URL.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Next Image Optimization output.
[[headers]]
  for = "/_next/image*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Raw public assets (logos, hero art, favicons) - cache a day, revalidate in bg.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
